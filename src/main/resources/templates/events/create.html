<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head th:replace="fragments :: head"></head>
<body class="container">

<header th:replace="fragments :: header"></header>

<form method="post">
    <div class="form-group">
        <label>Name
            <input th:field="${event.name}" class="form-control">
        </label>
        <p class="error" th:errors="${event.name}"></p>
    </div>
    <div class="form-group">
        <label>Description
            <input th:field="${event.eventDetails.description}" class="form-control">
        </label>
        <p class="error" th:errors="${event.eventDetails.description}"></p>
    </div>
    <div class="form-group">
        <label>Contact Email
            <input th:field="${event.eventDetails.contactEmail}" class="form-control">
        </label>
        <p class="error" th:errors="${event.eventDetails.contactEmail}"></p>
    </div>
    <div class="form-group">
        <label>Location
            <input th:field="${event.eventDetails.location}" class="form-control">
        </label>
        <p class="error" th:errors="${event.eventDetails.location}"></p>
    </div>
    <div class="form-group">
        <label class="form-check-label">Is registration required?
            <input type="checkbox" name="eventDetails.registrationRequired"
                   th:checked="${event.eventDetails.registrationRequired}" class="form-check-input">
        </label>
        <p class="error" th:errors="${event.eventDetails.registrationRequired}"></p>
    </div>
    <div class="form-group">
        <label>Number of attendees
            <input th:field="${event.eventDetails.numberOfAttendees}" class="form-control">
        </label>
        <p class="error" th:errors="${event.eventDetails.numberOfAttendees}"></p>
    </div>
    <div class="form-group">
        <label>Category
            <select th:field="${event.category}">
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        ></option>
            </select>
            <p class="error" th:errors="${event.category}"></p>
        </label>
    </div>
    <div class="form-group">
        <input type="submit" value="Create" class="btn btn-success">
    </div>
</form>

</body>
</html>
